name: Validate skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install pytest PyYAML jsonschema
      - name: Check public files
        run: python check_package.py
      - name: Exercise installation and configuration
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s skills/skill-config/scripts -v
          python -m unittest discover -s skills/folha-ponto/scripts -v
          python -m unittest discover -s skills/priorities/scripts -v
      - name: Check existing helpers
        run: python -m pytest -q skills/record-pr/test_lighthouse_files.py skills/explain-pr/test_fill_anchors.py plugins/review/scripts/test_snapshot.py
